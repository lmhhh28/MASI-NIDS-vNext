[package]
name = "masi-edge"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false
build = "build.rs"

[lib]
name = "masi_edge"
path = "src/lib.rs"

[[bin]]
name = "masi-edge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
bytes = "1.11.1"
clap = { version = "4.6.0", features = ["derive"] }
crc32c = "0.6.8"
futures = "0.3.32"
fs2 = "0.4.3"
hex = "0.4.3"
ipnet = { version = "2.12.0", features = ["serde"] }
parking_lot = "0.12.5"
prost = "0.14.1"
prost-types = "0.14.1"
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
tonic = { version = "0.14.6", features = ["gzip", "tls-ring"] }
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.22.0", features = ["v4"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[dev-dependencies]
proptest = "1.10.0"
rcgen = { version = "0.14.9", features = ["pem"] }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

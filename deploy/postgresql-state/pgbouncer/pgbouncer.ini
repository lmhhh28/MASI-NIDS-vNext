[databases]
masi_state_module_test = host=postgres port=5432 dbname=masi_state_module_test

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /var/run/pgbouncer
pool_mode = transaction
auth_type = scram-sha-256
auth_file = /run/masi-postgresql/secrets/pgbouncer-users.txt
admin_users = masi_migration_login
stats_users = masi_monitoring_login

client_tls_sslmode = verify-full
client_tls_ca_file = /run/masi-postgresql/tls/ca.crt
client_tls_cert_file = /run/masi-postgresql/tls/pgbouncer.crt
client_tls_key_file = /run/masi-postgresql/tls/pgbouncer.key
client_tls_protocols = secure

server_tls_sslmode = verify-full
server_tls_ca_file = /run/masi-postgresql/tls/ca.crt
server_tls_cert_file = /run/masi-postgresql/tls/client.crt
server_tls_key_file = /run/masi-postgresql/tls/client.key
server_tls_protocols = secure
server_reset_query = DISCARD ALL
server_check_query = SELECT 1
server_check_delay = 5

max_client_conn = 256
default_pool_size = 24
min_pool_size = 2
reserve_pool_size = 4
reserve_pool_timeout = 2
max_db_connections = 32
max_user_connections = 32
query_timeout = 35
query_wait_timeout = 10
client_idle_timeout = 600
idle_transaction_timeout = 30
server_idle_timeout = 60
server_lifetime = 1800
pkt_buf = 4096
max_packet_size = 16777216
application_name_add_host = 1
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
verbose = 0
pidfile = /var/run/pgbouncer/pgbouncer.pid

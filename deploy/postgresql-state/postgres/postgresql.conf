# PostgreSQL State operational-single-domain qualification profile.
# Authentication and network identity are enforced by pg_hba.conf and TLS.
listen_addresses = '*'
port = 5432
ssl = on
ssl_cert_file = '/run/masi-postgresql/tls/server.crt'
ssl_key_file = '/run/masi-postgresql/tls/server.key'
ssl_ca_file = '/run/masi-postgresql/tls/ca.crt'
ssl_min_protocol_version = 'TLSv1.3'
ssl_max_protocol_version = 'TLSv1.3'
password_encryption = 'scram-sha-256'

max_connections = 96
superuser_reserved_connections = 4
shared_buffers = '256MB'
effective_cache_size = '768MB'
work_mem = '8MB'
maintenance_work_mem = '128MB'
max_wal_size = '2GB'
min_wal_size = '256MB'
wal_level = replica
max_wal_senders = 8
max_replication_slots = 8
wal_keep_size = '256MB'
hot_standby = on

archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f'
archive_timeout = '5s'

statement_timeout = '30s'
lock_timeout = '5s'
idle_in_transaction_session_timeout = '30s'
idle_session_timeout = '10min'
deadlock_timeout = '1s'
tcp_keepalives_idle = '30s'
tcp_keepalives_interval = '10s'
tcp_keepalives_count = 3

log_destination = 'stderr'
logging_collector = off
log_connections = on
log_disconnections = on
log_lock_waits = on
log_min_duration_statement = '2s'
log_line_prefix = '%m [%p] db=%d,user=%u,app=%a,client=%h '
timezone = 'UTC'

[package]
name = "masi-plugin-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false
build = "build.rs"

[lib]
name = "masi_plugin_host"
path = "src/lib.rs"

[[bin]]
name = "masi-plugin-host"
path = "src/main.rs"

[[bin]]
name = "masi-plugin-hostctl"
path = "src/bin/hostctl.rs"

[[bin]]
name = "masi-plugin-service-fixture"
path = "src/bin/service_fixture.rs"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22.1"
bytes = "1.11.1"
clap = { version = "4.6.0", features = ["derive"] }
hex = "0.4.3"
http = "1.4.0"
hyper-util = { version = "0.1.20", features = ["tokio"] }
libc = "0.2.183"
prost = "0.14.4"
ring = "0.17.14"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
uuid = { version = "1.22.0", features = ["v4"] }
wasmtime = { version = "=47.0.3", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "wat"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[dev-dependencies]
proptest = "1.10.0"
rcgen = { version = "0.14.9", features = ["pem"] }
tempfile = "3.27.0"
wat = "1.257.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

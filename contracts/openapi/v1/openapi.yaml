openapi: 3.1.2
x-masi-openapi-profile: openapi-rest/v1
x-masi-contract-version: masi-openapi/v1
info:
  title: MASI-NIDS Go Control Core REST API
  version: 1.2.0
  description: |
    Same-origin HTTPS REST API for MOD-CTRL-001. Every list is scope-filtered and
    bounded to 200 records, with an authenticated server cursor. Every business
    mutation requires the OIDC session and CSRF scheme together, an exact
    idempotency_key, Origin/Sec-Fetch-Site validation, and server-side scope
    authorization. A 202 response means a durable operation was accepted or
    prepared; it never means an external side effect succeeded.
  license: {name: Apache-2.0, identifier: Apache-2.0}
servers:
  - {url: https://control-core.local, description: Same-origin production endpoint}
security:
  - oidc: []

paths:
  /api/session:
    get:
      operationId: getSession
      responses:
        '200': {description: session bootstrap, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        '401': {$ref: '#/components/responses/Error401'}
  /api/dashboard:
    get:
      operationId: getDashboard
      responses:
        '200': {description: one-statement bounded Overview snapshot, content: {application/json: {schema: {$ref: '../../web/v1/dashboard.schema.json'}}}}
        '403': {$ref: '#/components/responses/Error403'}
        '503': {$ref: '#/components/responses/Error503'}
  /api/events:
    get:
      operationId: listEvents
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {$ref: '#/components/responses/Projection200'}
        '400': {$ref: '#/components/responses/Error400'}
  /api/events/{id}:
    get:
      operationId: getEvent
      parameters:
        - {$ref: '#/components/parameters/EventID'}
      responses:
        '200': {$ref: '#/components/responses/Projection200'}
        '404': {$ref: '#/components/responses/Error404'}
  /api/incidents:
    get:
      operationId: listIncidents
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
  /api/evidence:
    get:
      operationId: listEvidence
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
  /api/evidence/captures:
    get:
      operationId: listBoundedCaptures
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
    post:
      operationId: registerBoundedCapture
      security: [{oidc: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BoundedCaptureRegistrationRequest'}}}}
      responses: {'201': {$ref: '#/components/responses/Mutation201'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/evidence/captures/{captureID}/intents:
    post:
      operationId: createBoundedCaptureIntent
      security: [{oidc: [], csrf: []}]
      parameters: [{name: captureID, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateEffectIntentRequest'}}}}
      responses: {'202': {$ref: '#/components/responses/Mutation200'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/effects/proposals:
    get:
      operationId: listProposals
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
    post:
      operationId: createProposal
      security: [{oidc: [], csrf: []}]
      requestBody: {$ref: '#/components/requestBodies/CreateProposal'}
      responses:
        '201': {description: immutable proposal created, content: {application/json: {schema: {$ref: '#/components/schemas/Proposal'}}}}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '409': {$ref: '#/components/responses/Error409'}
  /api/effects/proposals/{proposalID}:
    get:
      operationId: getProposal
      parameters: [{$ref: '#/components/parameters/ProposalID'}]
      responses:
        '200': {description: exact immutable proposal and governance state, content: {application/json: {schema: {$ref: '#/components/schemas/EffectProposalDetail'}}}}
        '404': {$ref: '#/components/responses/Error404'}
  /api/effects/proposals/{proposalID}/supersede:
    post:
      operationId: supersedeProposal
      security: [{oidc: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/ProposalID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SupersedeProposalRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/Mutation200'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/effects/decisions:
    get:
      operationId: listDecisions
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
    post:
      operationId: recordDecision
      security: [{oidc: [], csrf: []}]
      requestBody: {$ref: '#/components/requestBodies/RecordDecision'}
      responses:
        '201': {description: terminal authorization decision recorded, content: {application/json: {schema: {$ref: '#/components/schemas/Decision'}}}}
        '403': {$ref: '#/components/responses/Error403'}
        '409': {$ref: '#/components/responses/Error409'}
  /api/effects/decisions/{decisionID}:
    get:
      operationId: getDecision
      parameters: [{$ref: '#/components/parameters/DecisionID'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}, '404': {$ref: '#/components/responses/Error404'}}
  /api/effects/intents:
    get:
      operationId: listEffectIntents
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
    post:
      operationId: createEffectIntent
      security: [{oidc: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateEffectIntentRequest'}}}}
      responses: {'201': {$ref: '#/components/responses/Mutation201'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/effects/intents/{intentID}:
    get:
      operationId: getEffectIntent
      parameters: [{$ref: '#/components/parameters/IntentID'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}, '404': {$ref: '#/components/responses/Error404'}}
  /api/effects/operations/{operationID}:
    get:
      operationId: getEffectOperation
      parameters: [{$ref: '#/components/parameters/OperationID'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}, '404': {$ref: '#/components/responses/Error404'}}
  /api/effects/operations/{operationID}/attempts:
    get:
      operationId: getEffectOperationAttempts
      parameters: [{$ref: '#/components/parameters/OperationID'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
  /api/effects/operations/{operationID}/readback:
    get:
      operationId: getEffectOperationReadback
      parameters: [{$ref: '#/components/parameters/OperationID'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
  /api/effects/operations/{operationID}/reconcile:
    post:
      operationId: reconcileEffectOperation
      security: [{oidc: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/OperationID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScopedMutationRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/Mutation200'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/targets:
    get:
      operationId: listTargets
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
    post:
      operationId: registerTarget
      security: [{oidc: [], csrf: []}]
      requestBody: {$ref: '#/components/requestBodies/RegisterTarget'}
      responses:
        '201': {description: stable candidate target created, content: {application/json: {schema: {$ref: '#/components/schemas/Target'}}}}
        '403': {$ref: '#/components/responses/Error403'}
        '409': {$ref: '#/components/responses/Error409'}
  /api/targets/{targetID}:
    get:
      operationId: getTarget
      parameters: [{$ref: '#/components/parameters/TargetID'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}, '404': {$ref: '#/components/responses/Error404'}}
  /api/targets/candidates/import:
    post:
      operationId: importTargetCandidate
      security: [{oidc: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ImportTargetCandidateRequest'}}}}
      responses: {'201': {$ref: '#/components/responses/Mutation201'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/targets/candidates/{targetID}/diff:
    get:
      operationId: getTargetCandidateDiff
      parameters: [{$ref: '#/components/parameters/TargetID'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}, '404': {$ref: '#/components/responses/Error404'}}
  /api/targets/{targetID}/observation:
    get:
      operationId: getTargetObservation
      parameters: [{$ref: '#/components/parameters/TargetID'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}, '404': {$ref: '#/components/responses/Error404'}}
  /api/targets/{targetID}/operations/{operationID}:
    get:
      operationId: getTargetOperation
      parameters: [{$ref: '#/components/parameters/TargetID'}, {$ref: '#/components/parameters/OperationID'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}, '404': {$ref: '#/components/responses/Error404'}}
  /api/targets/{targetID}/verify:
    post:
      operationId: verifyTarget
      security: [{oidc: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/TargetID'}]
      requestBody: {$ref: '#/components/requestBodies/AdminLifecycle'}
      responses: {'200': {$ref: '#/components/responses/Mutation200'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/targets/{targetID}/assign:
    post:
      operationId: assignTarget
      security: [{oidc: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/TargetID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssignTargetRequest'}}}}
      responses: {'201': {$ref: '#/components/responses/Mutation201'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/targets/{targetID}/drain:
    post: {operationId: drainTarget, security: [{oidc: [], csrf: []}], parameters: [{$ref: '#/components/parameters/TargetID'}], requestBody: {$ref: '#/components/requestBodies/AdminLifecycle'}, responses: {'200': {$ref: '#/components/responses/Mutation200'}, '409': {$ref: '#/components/responses/Error409'}}}
  /api/targets/{targetID}/disable:
    post: {operationId: disableTarget, security: [{oidc: [], csrf: []}], parameters: [{$ref: '#/components/parameters/TargetID'}], requestBody: {$ref: '#/components/requestBodies/AdminLifecycle'}, responses: {'200': {$ref: '#/components/responses/Mutation200'}, '409': {$ref: '#/components/responses/Error409'}}}
  /api/targets/{targetID}/quarantine:
    post: {operationId: quarantineTarget, security: [{oidc: [], csrf: []}], parameters: [{$ref: '#/components/parameters/TargetID'}], requestBody: {$ref: '#/components/requestBodies/AdminLifecycle'}, responses: {'200': {$ref: '#/components/responses/Mutation200'}, '409': {$ref: '#/components/responses/Error409'}}}
  /api/targets/{targetID}/activate:
    post:
      operationId: activateTarget
      security: [{oidc: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/TargetID'}]
      requestBody: {$ref: '#/components/requestBodies/AdminLifecycle'}
      responses: {'200': {$ref: '#/components/responses/Mutation200'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/targets/{targetID}/retire:
    post:
      operationId: retireTarget
      security: [{oidc: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/TargetID'}]
      requestBody: {$ref: '#/components/requestBodies/AdminLifecycle'}
      responses: {'200': {$ref: '#/components/responses/Mutation200'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/fleet/operations:
    get:
      operationId: listFleetOperations
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
    post:
      operationId: createFleetOperation
      security: [{oidc: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [idempotency_key], maxProperties: 8, properties: {idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}}}}}}
      responses: {'201': {$ref: '#/components/responses/Mutation201'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/fleet/operations/{fleetID}:
    get:
      operationId: getFleetOperation
      parameters: [{$ref: '#/components/parameters/FleetID'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}, '404': {$ref: '#/components/responses/Error404'}}
  /api/fleet/operations/{fleetID}/advance:
    post:
      operationId: advanceFleetWave
      security: [{oidc: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/FleetID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdvanceFleetWaveRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/Mutation200'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/fleet/operations/{fleetID}/rollback:
    post:
      operationId: createFleetRollback
      security: [{oidc: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/FleetID'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [idempotency_key], maxProperties: 5, properties: {idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}}}}}}
      responses: {'201': {$ref: '#/components/responses/Mutation201'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/firewall/revisions:
    get:
      operationId: listFirewallRevisions
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
    post:
      operationId: createFirewallRevision
      security: [{oidc: [], csrf: []}]
      requestBody: {$ref: '#/components/requestBodies/CreateFirewallRevision'}
      responses:
        '201': {description: immutable normalized revision created, content: {application/json: {schema: {$ref: '#/components/schemas/FirewallRevision'}}}}
        '403': {$ref: '#/components/responses/Error403'}
  /api/firewall/revisions/{revisionID}:
    get:
      operationId: getFirewallRevision
      parameters: [{$ref: '#/components/parameters/RevisionID'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}, '404': {$ref: '#/components/responses/Error404'}}
  /api/firewall/revisions/{revisionID}/inspection:
    get:
      operationId: inspectFirewallRevision
      parameters: [{$ref: '#/components/parameters/RevisionID'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
  /api/firewall/revisions/{revisionID}/activation-proposals:
    post:
      operationId: createFirewallActivationProposal
      security: [{oidc: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/RevisionID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FirewallProposalRequest'}}}}
      responses: {'201': {$ref: '#/components/responses/Mutation201'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/firewall/activation-proposals/{proposalID}/decisions:
    post:
      operationId: decideFirewallActivationProposal
      security: [{oidc: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/ProposalID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PathDecisionRequest'}}}}
      responses: {'201': {$ref: '#/components/responses/Mutation201'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/firewall/bindings:
    get:
      operationId: listFirewallBindings
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
  /api/firewall/activations/{operationID}:
    get:
      operationId: getFirewallActivation
      parameters: [{$ref: '#/components/parameters/OperationID'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}, '404': {$ref: '#/components/responses/Error404'}}
  /api/firewall/activations/{operationID}/rollback-proposals:
    post:
      operationId: createFirewallRollbackProposal
      security: [{oidc: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/OperationID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FirewallProposalRequest'}}}}
      responses: {'201': {$ref: '#/components/responses/Mutation201'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/firewall/activations:
    post:
      operationId: prepareFirewallActivation
      security: [{oidc: [], csrf: []}]
      requestBody: {$ref: '#/components/requestBodies/PrepareFirewallActivation'}
      responses:
        '202': {description: durable effect activation projection prepared; no P4 success implied, content: {application/json: {schema: {$ref: '#/components/schemas/OperationOutcome'}}}}
        '409': {$ref: '#/components/responses/Error409'}
  /api/firewall/overlays:
    post:
      operationId: createFirewallOverlay
      security: [{oidc: [], csrf: []}]
      requestBody: {$ref: '#/components/requestBodies/CreateFirewallOverlay'}
      responses:
        '201': {description: overlay fact plus upsert/delete intents atomically created, content: {application/json: {schema: {$ref: '#/components/schemas/MutationResult'}}}}
        '403': {$ref: '#/components/responses/Error403'}
        '409': {$ref: '#/components/responses/Error409'}
  /api/rule-effectiveness:
    get:
      operationId: listRuleEffectiveness
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
  /api/models/revisions:
    get:
      operationId: listModelRevisions
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
    post:
      operationId: registerModelRevision
      security: [{oidc: [], csrf: []}]
      requestBody: {$ref: '#/components/requestBodies/RegisterModelRevision'}
      responses:
        '201': {description: immutable model revision registered, content: {application/json: {schema: {$ref: '#/components/schemas/ModelRevision'}}}}
        '409': {$ref: '#/components/responses/Error409'}
  /api/models/revisions/{revisionID}/revoke:
    post:
      operationId: revokeModelRevision
      security: [{oidc: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/RevisionID'}]
      requestBody: {$ref: '#/components/requestBodies/AdminLifecycle'}
      responses: {'200': {$ref: '#/components/responses/Mutation200'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/models/bindings:
    get:
      operationId: listModelBindings
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
  /api/models/rollout-groups:
    get:
      operationId: listModelRolloutGroups
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
    post:
      operationId: createModelRolloutGroup
      security: [{oidc: [], csrf: []}]
      requestBody: {$ref: '#/components/requestBodies/CreateModelRolloutGroup'}
      responses:
        '201': {description: ordered shard vector durably frozen, content: {application/json: {schema: {$ref: '#/components/schemas/RolloutGroup'}}}}
        '409': {$ref: '#/components/responses/Error409'}
  /api/models/rollout-groups/{groupID}:
    get:
      operationId: getModelRolloutGroup
      parameters: [{$ref: '#/components/parameters/GroupID'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}, '404': {$ref: '#/components/responses/Error404'}}
  /api/models/rollout-groups/{groupID}/advance:
    post:
      operationId: advanceModelRolloutGroup
      security: [{oidc: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/GroupID'}]
      requestBody: {$ref: '#/components/requestBodies/AdvanceRolloutGroup'}
      responses:
        '202': {description: ordered rollout advanced; per-shard status remains authoritative, content: {application/json: {schema: {$ref: '#/components/schemas/RolloutGroup'}}}}
        '409': {$ref: '#/components/responses/Error409'}
  /api/models/rollout-groups/{groupID}/rollback:
    post:
      operationId: createModelRollbackGroup
      security: [{oidc: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/GroupID'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [idempotency_key], maxProperties: 5, properties: {idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}}}}}}
      responses: {'201': {$ref: '#/components/responses/Mutation201'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/models/incarnations/current:
    get:
      operationId: getCurrentModelControlIncarnation
      responses: {'200': {$ref: '#/components/responses/Projection200'}, '404': {$ref: '#/components/responses/Error404'}}
  /api/models/incarnations/rotate:
    post:
      operationId: rotateModelControlIncarnation
      security: [{oidc: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [idempotency_key], maxProperties: 7, properties: {idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}}}}}}
      responses: {'201': {$ref: '#/components/responses/Mutation201'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/models/incarnations/{incarnationID}/enable-writer:
    post:
      operationId: enableModelWriter
      security: [{oidc: [], csrf: []}]
      parameters: [{name: incarnationID, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScopedMutationRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/Mutation200'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/models/pools:
    get:
      operationId: listModelPools
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
  /api/models/pools/{poolID}:
    get:
      operationId: getModelPool
      parameters: [{name: poolID, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}, '404': {$ref: '#/components/responses/Error404'}}
  /api/models/operations/{operationID}:
    get:
      operationId: getModelOperation
      parameters: [{$ref: '#/components/parameters/OperationID'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}, '404': {$ref: '#/components/responses/Error404'}}
  /api/models/operations/{operationID}/recover:
    post:
      operationId: recoverModelOperation
      security: [{oidc: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/OperationID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScopedMutationRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/Mutation200'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/plugins:
    get:
      operationId: listPlugins
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
    post:
      operationId: registerPluginManifest
      security: [{oidc: [], csrf: []}]
      requestBody: {$ref: '#/components/requestBodies/RegisterPluginManifest'}
      responses:
        '201': {description: immutable signed manifest registered, content: {application/json: {schema: {$ref: '#/components/schemas/PluginManifest'}}}}
        '409': {$ref: '#/components/responses/Error409'}
  /api/plugins/{pluginID}/qualifications:
    post:
      operationId: qualifyPluginManifest
      security: [{oidc: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/PluginID'}]
      requestBody: {$ref: '#/components/requestBodies/QualifyPlugin'}
      responses: {'201': {$ref: '#/components/responses/Mutation201'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/plugins/{pluginID}/bindings:
    post:
      operationId: activatePluginBinding
      security: [{oidc: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/PluginID'}]
      requestBody: {$ref: '#/components/requestBodies/ActivatePluginBinding'}
      responses: {'201': {$ref: '#/components/responses/Mutation201'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/plugins/{pluginID}/drain:
    post:
      operationId: drainPluginBinding
      security: [{oidc: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/PluginID'}]
      requestBody: {$ref: '#/components/requestBodies/PluginLifecycle'}
      responses: {'200': {$ref: '#/components/responses/Mutation200'}}
  /api/plugins/{pluginID}/revoke:
    post:
      operationId: revokePluginBinding
      security: [{oidc: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/PluginID'}]
      requestBody: {$ref: '#/components/requestBodies/PluginLifecycle'}
      responses: {'200': {$ref: '#/components/responses/Mutation200'}}
  /api/plugins/{pluginID}/rollback:
    post:
      operationId: rollbackPluginBinding
      security: [{oidc: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/PluginID'}]
      requestBody: {$ref: '#/components/requestBodies/PluginLifecycle'}
      responses: {'200': {$ref: '#/components/responses/Mutation200'}}
  /api/plugins/statistics/definitions:
    get:
      operationId: listStatisticsDefinitions
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
    post:
      operationId: registerStatisticsDefinition
      security: [{oidc: [], csrf: []}]
      requestBody: {$ref: '#/components/requestBodies/RegisterStatisticsDefinition'}
      responses: {'201': {$ref: '#/components/responses/Mutation201'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/plugins/statistics/definitions/{definitionID}:
    get:
      operationId: getStatisticsDefinition
      parameters: [{name: definitionID, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}, '404': {$ref: '#/components/responses/Error404'}}
  /api/plugins/statistics/definitions/{definitionID}/history:
    get:
      operationId: getStatisticsDefinitionHistory
      parameters: [{name: definitionID, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
  /api/plugins/statistics/runs:
    get:
      operationId: listStatisticsRuns
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
    post:
      operationId: requestStatisticsRun
      security: [{oidc: [], csrf: []}]
      requestBody: {$ref: '#/components/requestBodies/RequestStatisticsRun'}
      responses: {'201': {$ref: '#/components/responses/Mutation201'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/plugins/statistics/runs/{runID}:
    get:
      operationId: getStatisticsRun
      parameters: [{name: runID, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}, '404': {$ref: '#/components/responses/Error404'}}
  /api/plugins/statistics/current:
    get:
      operationId: listStatisticsCurrent
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
  /api/plugins/statistics/schedules:
    get:
      operationId: listStatisticsSchedules
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
    post:
      operationId: createStatisticsScheduleRevision
      security: [{oidc: [], csrf: []}]
      requestBody: {$ref: '#/components/requestBodies/CreateStatisticsSchedule'}
      responses: {'201': {$ref: '#/components/responses/Mutation201'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/plugins/statistics/schedules/{scheduleID}:
    get:
      operationId: getStatisticsSchedule
      parameters: [{name: scheduleID, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}, '404': {$ref: '#/components/responses/Error404'}}
  /api/plugins/statistics/schedules/{scheduleID}/history:
    get:
      operationId: getStatisticsScheduleHistory
      parameters: [{name: scheduleID, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
  /api/plugins/statistics/schedules/{scheduleID}/revise:
    post:
      operationId: reviseStatisticsSchedule
      security: [{oidc: [], csrf: []}]
      parameters: [{name: scheduleID, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [idempotency_key], maxProperties: 8, properties: {idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}}}}}}
      responses: {'201': {$ref: '#/components/responses/Mutation201'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/plugins/statistics/schedules/{scheduleID}/disable:
    post:
      operationId: disableStatisticsSchedule
      security: [{oidc: [], csrf: []}]
      parameters: [{name: scheduleID, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [idempotency_key], maxProperties: 8, properties: {idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}}}}}}
      responses: {'201': {$ref: '#/components/responses/Mutation201'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/plugins/statistics/artifacts/{artifactID}:
    get:
      operationId: getStatisticsArtifact
      parameters: [{$ref: '#/components/parameters/ArtifactID'}]
      responses:
        '200': {description: exact validated artifact, content: {application/json: {schema: {$ref: '../../plugin/statistics/v1/schema.json#/$defs/artifact_record'}}}}
        '404': {$ref: '#/components/responses/Error404'}
  /api/analysis/tasks:
    get:
      operationId: listAnalysisTasks
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
    post:
      operationId: submitAnalysisTask
      security: [{oidc: [], csrf: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AnalysisTaskRequest'}}}}
      responses: {'202': {$ref: '#/components/responses/Mutation200'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/analysis/tasks/{taskID}/poll:
    post:
      operationId: pollAnalysisTask
      security: [{oidc: [], csrf: []}]
      parameters: [{name: taskID, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScopedMutationRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/Mutation200'}, '409': {$ref: '#/components/responses/Error409'}}
  /api/analysis/artifacts:
    get:
      operationId: listAnalysisArtifacts
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
  /api/analysis/artifacts/{artifactID}:
    get:
      operationId: getAnalysisArtifact
      parameters: [{$ref: '#/components/parameters/ArtifactID'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}, '404': {$ref: '#/components/responses/Error404'}}
  /api/audit:
    get:
      operationId: listAuditFacts
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/Projection200'}}
  /events:
    get:
      operationId: streamSseEvents
      responses:
        '200': {description: scope-filtered invalidation stream with 15s heartbeat and <=64KiB events, content: {text/event-stream: {schema: {type: string}}}}
  /healthz:
    get: {operationId: healthz, security: [], responses: {'200': {$ref: '#/components/responses/Health200'}}}
  /readyz:
    get: {operationId: readyz, security: [], responses: {'200': {$ref: '#/components/responses/Health200'}, '503': {$ref: '#/components/responses/Error503'}}}
  /livez:
    get: {operationId: livez, security: [], responses: {'200': {$ref: '#/components/responses/Health200'}, '503': {$ref: '#/components/responses/Error503'}}}
  /metrics:
    get: {operationId: metrics, security: [], responses: {'200': {description: bounded low-cardinality Prometheus text exposition, content: {text/plain: {schema: {type: string, maxLength: 1048576}}}}}}
  /oidc/login:
    get: {operationId: oidcLogin, security: [], responses: {'303': {description: redirect to exact configured issuer}}}
  /oidc/callback:
    get:
      operationId: oidcCallback
      security: []
      parameters:
        - {name: code, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
        - {name: state, in: query, required: true, schema: {type: string, minLength: 32, maxLength: 512}}
      responses: {'302': {description: server-side session created and HttpOnly cookie set}, '401': {$ref: '#/components/responses/Error401'}}
  /oidc/logout:
    post:
      operationId: oidcLogout
      security: [{oidc: [], csrf: []}]
      responses: {'200': {$ref: '#/components/responses/Mutation200'}}

components:
  securitySchemes:
    oidc:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://idp.local/authorize
          tokenUrl: https://idp.local/token
          scopes:
            openid: OpenID Connect identity
            masi:operator: scoped operator
            masi:platform-admin: scoped platform administrator
            masi:analyst: scoped analyst
            masi:auditor: scoped auditor
            plugin.statistics.run: on-demand statistics execution
    csrf: {type: apiKey, in: header, name: X-CSRF-Token}
  parameters:
    Cursor: {name: cursor, in: query, required: false, schema: {type: string, maxLength: 512, pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'}}
    PageSize: {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    EventID: {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}
    TargetID: {name: targetID, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}
    RevisionID: {name: revisionID, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}
    GroupID: {name: groupID, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}
    PluginID: {name: pluginID, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}
    ArtifactID: {name: artifactID, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}
    ProposalID: {name: proposalID, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}
    DecisionID: {name: decisionID, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}
    IntentID: {name: intentID, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}
    OperationID: {name: operationID, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}
    FleetID: {name: fleetID, in: path, required: true, schema: {$ref: '#/components/schemas/Identity'}}
  requestBodies:
    CreateProposal:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/CreateProposalRequest'}}}
    RecordDecision:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/RecordDecisionRequest'}}}
    RegisterTarget:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/RegisterTargetRequest'}}}
    AdminLifecycle:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/AdminLifecycleRequest'}}}
    CreateFirewallRevision:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/CreateFirewallRevisionRequest'}}}
    PrepareFirewallActivation:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/PrepareFirewallActivationRequest'}}}
    CreateFirewallOverlay:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/CreateFirewallOverlayRequest'}}}
    RegisterModelRevision:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/RegisterModelRevisionRequest'}}}
    CreateModelRolloutGroup:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/CreateModelRolloutGroupRequest'}}}
    AdvanceRolloutGroup:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/AdvanceRolloutGroupRequest'}}}
    RegisterPluginManifest:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/RegisterPluginManifestRequest'}}}
    QualifyPlugin:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/QualifyPluginRequest'}}}
    ActivatePluginBinding:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/ActivatePluginBindingRequest'}}}
    PluginLifecycle:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/PluginLifecycleRequest'}}}
    RegisterStatisticsDefinition:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/RegisterStatisticsDefinitionRequest'}}}
    RequestStatisticsRun:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/RequestStatisticsRunRequest'}}}
    CreateStatisticsSchedule:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/CreateStatisticsScheduleRequest'}}}
  responses:
    Projection200: {description: bounded scope-filtered projection, content: {application/json: {schema: {$ref: '#/components/schemas/Projection'}}}}
    Mutation200: {description: mutation converged, content: {application/json: {schema: {$ref: '#/components/schemas/MutationResult'}}}}
    Mutation201: {description: immutable/durable resource created, content: {application/json: {schema: {$ref: '#/components/schemas/MutationResult'}}}}
    Health200: {description: process health state, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
    Error400: {description: malformed request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Error401: {description: unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Error403: {description: authorization denied, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Error404: {description: resource not found in authorized scope, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Error409: {description: CAS, idempotency, immutable identity, or stale fence conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Error503: {description: dependency unavailable or process not accepting mutations, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Identity: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'}
    Digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    ReasonCode: {type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$'}
    IdempotencyKey: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'}
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties: {error: {$ref: '#/components/schemas/ReasonCode'}}
    Session:
      type: object
      additionalProperties: false
      required: [schema_version, actor_ref, csrf_token, expires_at, step_up]
      properties:
        schema_version: {const: masi-web-projection/v1}
        actor_ref: {$ref: '#/components/schemas/Identity'}
        csrf_token: {type: string, minLength: 32, maxLength: 256}
        expires_at: {type: integer, minimum: 1}
        step_up: {enum: [none, webauthn-fido2, passkey, hardware-key]}
    EffectProposalDetail:
      type: object
      additionalProperties: false
      required: [proposal_id, proposal_digest, scope, risk_level, effect_kind, target_set_digest, target_ids, policy_digest, evidence_refs, expires_at_unix_ms, note, created_at_unix_ms, actor_ref, reason_code, governance_status, superseded_by_proposal_id, superseded_at_unix_ms, supersede_reason_code]
      properties:
        proposal_id: {$ref: '#/components/schemas/Identity'}
        proposal_digest: {$ref: '#/components/schemas/Digest'}
        scope: {type: string, minLength: 1, maxLength: 256}
        risk_level: {enum: [R0, R1, R2, R3]}
        effect_kind: {$ref: '#/components/schemas/Identity'}
        target_set_digest: {$ref: '#/components/schemas/Digest'}
        target_ids: {type: array, minItems: 1, maxItems: 128, uniqueItems: true, items: {$ref: '#/components/schemas/Identity'}}
        policy_digest: {$ref: '#/components/schemas/Digest'}
        evidence_refs: {type: array, maxItems: 128, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 256}}
        expires_at_unix_ms: {type: integer, minimum: 1}
        note: {type: string, maxLength: 2048}
        created_at_unix_ms: {type: integer, minimum: 1}
        actor_ref: {$ref: '#/components/schemas/Identity'}
        reason_code: {$ref: '#/components/schemas/ReasonCode'}
        governance_status: {enum: [pending, approved, rejected, expired, superseded]}
        superseded_by_proposal_id: {type: [string, 'null'], maxLength: 128}
        superseded_at_unix_ms: {type: [integer, 'null'], minimum: 1}
        supersede_reason_code: {type: [string, 'null'], maxLength: 64}
    Projection:
      type: object
      additionalProperties: false
      required: [schema_version, projection_type, resource_kind, cursor, page_size, total_count, items, generation, session_scope, authorized_scope, sse_event, actor_ref, reason_code, trace_id]
      properties:
        schema_version: {const: masi-web-projection/v1}
        projection_type: {enum: [current, desired, observed, stale, hold, unknown, reconciling]}
        resource_kind: {$ref: '#/components/schemas/Identity'}
        resource_id: {$ref: '#/components/schemas/Identity'}
        cursor: {type: string, maxLength: 512}
        page_size: {type: integer, minimum: 1, maximum: 200}
        total_count: {type: integer, minimum: 0}
        items:
          type: array
          maxItems: 200
          items: {type: object, maxProperties: 64}
        generation: {type: integer, minimum: 1}
        session_scope: {type: string, minLength: 1, maxLength: 4096}
        authorized_scope: {type: string, minLength: 1, maxLength: 4096}
        sse_event: {type: [object, 'null']}
        actor_ref: {$ref: '#/components/schemas/Identity'}
        reason_code: {$ref: '#/components/schemas/ReasonCode'}
        trace_id: {type: string, maxLength: 128}
    MutationResult:
      type: object
      minProperties: 1
      maxProperties: 16
      propertyNames: {pattern: '^[a-z][a-z0-9_]{0,63}$'}
    Health:
      type: object
      minProperties: 1
      maxProperties: 32
      properties:
        state: {enum: [starting, ready, draining, stopped, quarantined]}
        status: {type: string, maxLength: 64}
        domains: {type: array, maxItems: 32, items: {type: object, maxProperties: 8}}
    TLSIdentity:
      type: object
      additionalProperties: false
      required: [server_name, identity_ref]
      properties:
        server_name: {type: string, minLength: 1, maxLength: 253}
        identity_ref: {$ref: '#/components/schemas/Identity'}
    CreateProposalRequest:
      type: object
      additionalProperties: false
      required: [effect_kind, target_ids, scope, policy_digest, risk_level, evidence_refs, note, idempotency_key, trace_id, expires_at_unix_ms]
      properties:
        effect_kind: {$ref: '#/components/schemas/Identity'}
        target_ids: {type: array, minItems: 1, maxItems: 128, uniqueItems: true, items: {$ref: '#/components/schemas/Identity'}}
        scope: {type: string, minLength: 1, maxLength: 256}
        policy_digest: {$ref: '#/components/schemas/Digest'}
        risk_level: {enum: [R0, R1, R2, R3]}
        evidence_refs: {type: array, maxItems: 128, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 256}}
        note: {type: string, maxLength: 2048}
        idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}
        trace_id: {$ref: '#/components/schemas/Identity'}
        expires_at_unix_ms: {type: integer, minimum: 1}
    RecordDecisionRequest:
      type: object
      additionalProperties: false
      required: [proposal_id, decision, reason_code, idempotency_key]
      properties:
        proposal_id: {$ref: '#/components/schemas/Identity'}
        decision: {enum: [approve, reject]}
        reason_code: {$ref: '#/components/schemas/ReasonCode'}
        idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}
    PathDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, reason_code, idempotency_key]
      properties:
        decision: {enum: [approve, reject]}
        reason_code: {$ref: '#/components/schemas/ReasonCode'}
        idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}
    ScopedMutationRequest:
      type: object
      additionalProperties: false
      required: [scope, target_set_digest, idempotency_key]
      properties:
        scope: {type: string, minLength: 1, maxLength: 256}
        target_set_digest: {$ref: '#/components/schemas/Digest'}
        idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}
    SupersedeProposalRequest:
      type: object
      additionalProperties: false
      required: [replacement_proposal_id, scope, target_set_digest, reason_code, idempotency_key]
      properties:
        replacement_proposal_id: {$ref: '#/components/schemas/Identity'}
        scope: {type: string, minLength: 1, maxLength: 256}
        target_set_digest: {$ref: '#/components/schemas/Digest'}
        reason_code: {$ref: '#/components/schemas/ReasonCode'}
        idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}
    CreateEffectIntentRequest:
      type: object
      additionalProperties: false
      required: [proposal_id, decision_id, effect_intent_id, operation_id, scope, target_set_digest, deadline_unix_ms, idempotency_key]
      properties:
        proposal_id: {$ref: '#/components/schemas/Identity'}
        decision_id: {$ref: '#/components/schemas/Identity'}
        effect_intent_id: {$ref: '#/components/schemas/Identity'}
        operation_id: {$ref: '#/components/schemas/Identity'}
        scope: {type: string, minLength: 1, maxLength: 256}
        target_set_digest: {$ref: '#/components/schemas/Digest'}
        deadline_unix_ms: {type: integer, minimum: 1}
        idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}
    BoundedCaptureRegistrationRequest:
      type: object
      additionalProperties: false
      required: [target_id, scope, target_set_digest, spec, trace_id, idempotency_key]
      properties:
        target_id: {$ref: '#/components/schemas/Identity'}
        scope: {type: string, minLength: 1, maxLength: 256}
        target_set_digest: {$ref: '#/components/schemas/Digest'}
        spec: {type: object, minProperties: 6, maxProperties: 12}
        trace_id: {$ref: '#/components/schemas/Identity'}
        idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}
    ImportTargetCandidateRequest:
      type: object
      additionalProperties: false
      required: [target, provenance, target_set_digest, idempotency_key]
      properties:
        target: {type: object, minProperties: 8, maxProperties: 16}
        provenance:
          type: object
          additionalProperties: false
          required: [source_id, source_revision, retrieved_at_unix_ms, digest]
          properties:
            source_id: {$ref: '#/components/schemas/Identity'}
            source_revision: {type: string, minLength: 1, maxLength: 128}
            retrieved_at_unix_ms: {type: integer, minimum: 1}
            digest: {$ref: '#/components/schemas/Digest'}
        target_set_digest: {$ref: '#/components/schemas/Digest'}
        idempotency_key: {$ref: '#/components/schemas/IdempotencyKey'}
    AssignTargetRequest:
      type: object
      additionalProperties: false
      required: [assignment, prior_generation, prior_election_ceiling, scope, target_set_digest, idempotency_key]
      properties:
        assignment: {type: object, minProperties: 10, maxProperties: 18}

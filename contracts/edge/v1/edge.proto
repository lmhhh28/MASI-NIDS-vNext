  uint64 pool_generation = 9;
  uint64 expected_binding_generation = 10;
  uint64 proposed_binding_generation = 11;
  uint64 current_binding_generation = 12;
  string startup_envelope_digest = 13;
  string pool_observation_digest = 14;
  string binding_digest = 15;

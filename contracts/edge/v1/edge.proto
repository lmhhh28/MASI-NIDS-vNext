  string schema_version = 1;
  string shard_id = 2;
  string current_model_control_incarnation_id = 3;
  uint64 current_route_epoch = 4;
  uint64 proposed_route_epoch = 5;
  string trace_id = 6;
}

message CommitRouteRequest {
  InferenceRoute route = 1;
  string trace_id = 2;
}

message ResumeRouteRequest {
  string schema_version = 1;
  string shard_id = 2;
  string model_control_incarnation_id = 3;

  uint64 binding_generation = 6;
  uint64 route_epoch = 7;
  string model_revision_digest = 8;
  string feature_contract_digest = 9;
  string label_contract_digest = 10;
  string output_adapter_digest = 11;
  string wire_profile = 12;
  string runtime_profile = 13;
  string endpoint = 14;
  TlsClientIdentity tls = 15;
  string operation_id = 16;
  string scope = 17;
  uint64 expected_binding_generation = 18;
  uint64 proposed_binding_generation = 19;
  uint64 current_binding_generation = 20;
  string startup_envelope_digest = 21;
  string pool_observation_digest = 22;
  string binding_digest = 23;
  string model_bundle_digest = 24;
  string wire_profile_digest = 25;
  string runtime_profile_digest = 26;
  string optimization_profile_digest = 27;
}


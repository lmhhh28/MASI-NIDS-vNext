// Public Edge Agent contracts. This file is the only source for generated
// Rust/Go/C++/Python/TypeScript adapters at the Edge boundaries.
syntax = "proto3";

package masi.edge.v1;

option go_package = "masi-nids/control-go/internal/grpc/edgev1";

enum AdmissionResult {
  ADMISSION_RESULT_UNSPECIFIED = 0;
  ADMISSION_RESULT_ACCEPTED = 1;
  ADMISSION_RESULT_HOLD = 2;
}

enum InferenceRouteLifecycle {
  INFERENCE_ROUTE_LIFECYCLE_UNSPECIFIED = 0;
  INFERENCE_ROUTE_LIFECYCLE_WITHDRAWN = 1;
  INFERENCE_ROUTE_LIFECYCLE_DRAINING = 2;
  INFERENCE_ROUTE_LIFECYCLE_READY = 3;
  INFERENCE_ROUTE_LIFECYCLE_ACTIVE = 4;
  INFERENCE_ROUTE_LIFECYCLE_HOLD = 5;
}

enum DataQuality {
  DATA_QUALITY_UNSPECIFIED = 0;
  DATA_QUALITY_VALID = 1;
  DATA_QUALITY_PARTIAL = 2;
  DATA_QUALITY_GAP = 3;
  DATA_QUALITY_STALE = 4;
  DATA_QUALITY_INVALID = 5;
  DATA_QUALITY_RESET = 6;
  DATA_QUALITY_NOT_COVERED = 7;
  DATA_QUALITY_NOT_MEASURABLE = 8;
}

enum SnapshotConsistency {
  SNAPSHOT_CONSISTENCY_UNSPECIFIED = 0;
  SNAPSHOT_CONSISTENCY_STABLE = 1;
  SNAPSHOT_CONSISTENCY_RETRY_EXHAUSTED = 2;
}

enum ClearAdvanceCondition {
  CLEAR_ADVANCE_CONDITION_UNSPECIFIED = 0;
  CLEAR_ADVANCE_CONDITION_READBACK_STABLE = 1;
  CLEAR_ADVANCE_CONDITION_RETAIN_FOR_RETRY = 2;
}

enum InferenceDecision {
  INFERENCE_DECISION_UNSPECIFIED = 0;
  INFERENCE_DECISION_BENIGN = 1;
  INFERENCE_DECISION_ALERT = 2;
  INFERENCE_DECISION_ABSTAIN = 3;
}

enum InferenceExecutionStatus {
  INFERENCE_EXECUTION_STATUS_UNSPECIFIED = 0;
  INFERENCE_EXECUTION_STATUS_OK = 1;
  INFERENCE_EXECUTION_STATUS_HOLD = 2;
  INFERENCE_EXECUTION_STATUS_ERROR = 3;
}

enum CanonicalCommitStatus {
  CANONICAL_COMMIT_STATUS_UNSPECIFIED = 0;
  CANONICAL_COMMIT_STATUS_COMMITTED = 1;
  CANONICAL_COMMIT_STATUS_IDEMPOTENT = 2;
}

enum InstallationReadbackStatus {
  INSTALLATION_READBACK_STATUS_UNSPECIFIED = 0;
  INSTALLATION_READBACK_STATUS_EXACT = 1;
  INSTALLATION_READBACK_STATUS_MISSING = 2;
  INSTALLATION_READBACK_STATUS_MISMATCH = 3;
}

enum PublishStatus {
  PUBLISH_STATUS_UNSPECIFIED = 0;
  PUBLISH_STATUS_ACCEPTED = 1;
  PUBLISH_STATUS_CHECKPOINTED = 2;
  PUBLISH_STATUS_IDEMPOTENT = 3;
}

enum FreshnessStatus {
  FRESHNESS_STATUS_UNSPECIFIED = 0;
  FRESHNESS_STATUS_NOT_OBSERVED = 1;
  FRESHNESS_STATUS_FRESH = 2;
  FRESHNESS_STATUS_STALE = 3;
  FRESHNESS_STATUS_GAP = 4;
}

service EdgeControl {
  rpc AssignTarget(AssignTargetRequest) returns (TargetReply);
  rpc RenewTarget(RenewTargetRequest) returns (TargetReply);
  rpc RevokeTarget(RevokeTargetRequest) returns (TargetReply);
  rpc PreflightEffect(PreflightEffectRequest) returns (PreflightEffectReply);
  rpc ExecuteEffect(ExecuteEffectRequest) returns (EffectResult);
  rpc AcknowledgeEffect(AcknowledgeEffectRequest) returns (PublishAck);
  rpc PrepareRoute(PrepareRouteRequest) returns (RouteReply);
  rpc CommitRoute(CommitRouteRequest) returns (RouteReply);
  rpc ResumeRoute(ResumeRouteRequest) returns (RouteReply);
  rpc ConfigureRuleObservations(ConfigureRuleObservationsRequest) returns (PublishAck);
  rpc GetStatus(GetStatusRequest) returns (EdgeStatus);
}

service ControlSink {
  rpc CommitResults(InferenceResultBatch) returns (CanonicalAckBatch);
  rpc PublishRuleObservations(RuleObservationBatch) returns (PublishAck);
  rpc PublishTargetStatus(TargetStatusBatch) returns (PublishAck);
}

message Fence {
  string target_control_incarnation_id = 1;
  uint64 target_assignment_generation = 2;
  string actor_runtime_epoch = 3;
  uint64 application_generation = 4;
  uint64 election_id_high = 5;
  uint64 election_id_low = 6;
}

message PipelineIdentity {
  string p4runtime_api_version = 1;
  string p4info_digest = 2;
  string device_config_digest = 3;
  string profile_digest = 4;
  uint64 cookie = 5;
  repeated P4WriteAtomicity supported_write_atomicity = 6;
}

enum P4WriteAtomicity {
  P4_WRITE_ATOMICITY_UNSPECIFIED = 0;
  P4_WRITE_ATOMICITY_CONTINUE_ON_ERROR = 1;
  P4_WRITE_ATOMICITY_ROLLBACK_ON_ERROR = 2;
  P4_WRITE_ATOMICITY_DATAPLANE_ATOMIC = 3;
}

message TlsClientIdentity {
  string server_name = 1;
  string identity_ref = 2;
}

message TargetAssignment {
  string schema_version = 1;
  string target_id = 2;
  uint64 device_id = 3;
  string role = 4;
  string p4runtime_endpoint = 5;
  TlsClientIdentity p4runtime_tls = 6;
  Fence fence = 7;
  string lease_id = 8;
  int64 issued_at_unix_ms = 9;
  int64 expires_at_unix_ms = 10;
  uint64 election_floor = 11;
  uint64 election_ceiling = 12;
  PipelineIdentity expected_pipeline = 13;
  uint64 observation_epoch = 14;
  uint64 reset_epoch = 15;
  string trace_id = 16;
}

message AssignTargetRequest { TargetAssignment assignment = 1; }

message RenewTargetRequest {
  string schema_version = 1;
  string target_id = 2;
  Fence fence = 3;
  string lease_id = 4;
  int64 expires_at_unix_ms = 5;
  string trace_id = 6;
}

message RevokeTargetRequest {
  string schema_version = 1;
  string target_id = 2;
  Fence fence = 3;
  string lease_id = 4;
  string reason_code = 5;
  string trace_id = 6;
}

enum ActorState {
  ACTOR_STATE_UNSPECIFIED = 0;
  ACTOR_STATE_CONNECTING = 1;
  ACTOR_STATE_READ_ONLY = 2;
  ACTOR_STATE_PRIMARY = 3;
  ACTOR_STATE_DRAINING = 4;
  ACTOR_STATE_REVOKED = 5;
  ACTOR_STATE_HOLD = 6;
}

message TargetReply {
  string target_id = 1;
  ActorState state = 2;
  string actor_runtime_epoch = 3;
  string reason_code = 4;
  string trace_id = 5;
}

enum EffectKind {
  EFFECT_KIND_UNSPECIFIED = 0;
  EFFECT_KIND_BASELINE_ACTIVATE = 1;
  EFFECT_KIND_OVERLAY_UPSERT = 2;
  EFFECT_KIND_OVERLAY_DELETE = 3;
  EFFECT_KIND_BOUNDED_CAPTURE_START = 4;
}

// BoundedCaptureSpec is an R0, resource-bounded device mutation. It travels
// through the same durable EffectIntent/journal/readback/CAS path as firewall
// effects; it is not a second queue or a general packet-capture service.
message BoundedCaptureSpec {
  string schema_version = 1;
  string capture_id = 2;
  string capture_digest = 3;
  string capture_adapter_id = 4;
  uint32 duration_ms = 5;
  uint32 sample_limit = 6;
  uint64 byte_limit = 7;
  int64 expires_at_unix_ms = 8;
  uint32 max_concurrent_on_target = 9;
  string payload_mode = 10;
  Ipv4Prefix source = 11;
  Ipv4Prefix destination = 12;
  OptionalUint32 protocol = 13;
  OptionalUint32 source_port = 14;
  OptionalUint32 destination_port = 15;
}

enum FirewallAction {
  FIREWALL_ACTION_UNSPECIFIED = 0;
  FIREWALL_ACTION_PERMIT_AND_CONTINUE = 1;
  FIREWALL_ACTION_DROP = 2;
}

message Ipv4Prefix {
  fixed32 address = 1;
  uint32 prefix_length = 2;
}

message OptionalUint32 {
  bool present = 1;
  uint32 value = 2;
}

message BaselineRule {
  string rule_id = 1;
  uint64 rule_revision = 2;
  string canonical_rule_digest = 3;
  int32 priority = 4;
  OptionalUint32 ingress_port = 5;
  Ipv4Prefix source = 6;
  Ipv4Prefix destination = 7;
  OptionalUint32 protocol = 8;
  OptionalUint32 l4_present = 9;
  OptionalUint32 source_port = 10;
  OptionalUint32 destination_port = 11;
  OptionalUint32 fragment_class = 12;
  FirewallAction action = 13;
}

message OverlayRule {
  string rule_id = 1;
  uint64 rule_revision = 2;
  string canonical_rule_digest = 3;
  fixed32 source_ipv4 = 4;
  fixed32 destination_ipv4 = 5;
  uint32 protocol = 6;
  uint32 source_port = 7;
  uint32 destination_port = 8;
  FirewallAction action = 9;
  int64 expires_at_unix_ms = 10;
}

message EffectIntent {
  string schema_version = 1;
  string effect_intent_id = 2;
  string operation_id = 3;
  string target_id = 4;
  Fence fence = 5;
  string effect_digest = 6;
  string authorization_digest = 7;
  EffectKind kind = 8;
  string policy_revision_digest = 9;
  FirewallAction default_action = 10;
  repeated BaselineRule baseline_rules = 11;
  repeated OverlayRule overlay_rules = 12;
  int64 deadline_unix_ms = 13;
  string actor_ref = 14;
  string reason_code = 15;
  string trace_id = 16;
  P4WriteAtomicity required_write_atomicity = 17;
  BoundedCaptureSpec bounded_capture = 18;
}

message PreflightEffectRequest { EffectIntent intent = 1; }

message PreflightEffectReply {
  string target_id = 1;
  string effect_intent_id = 2;
  string preflight_token = 3;
  string plan_digest = 4;
  uint32 physical_entries = 5;
  int64 expires_at_unix_ms = 6;
  string result = 7;
  string reason_code = 8;
  string trace_id = 9;
  AdmissionResult admission = 10;
}

message ExecuteEffectRequest {
  EffectIntent intent = 1;
  string preflight_token = 2;
}

enum EffectStatus {
  EFFECT_STATUS_UNSPECIFIED = 0;
  EFFECT_STATUS_APPLIED = 1;
  EFFECT_STATUS_HOLD = 2;
  EFFECT_STATUS_UNKNOWN = 3;
  EFFECT_STATUS_RECONCILING = 4;
}

message EffectResult {
  string schema_version = 1;
  string target_id = 2;
  string effect_intent_id = 3;
  string operation_id = 4;
  Fence fence = 5;
  EffectStatus status = 6;
  string plan_digest = 7;
  string readback_digest = 8;
  uint32 expected_entries = 9;
  uint32 observed_entries = 10;
  uint32 mismatched_entries = 11;
  uint32 active_bank = 12;
  string reason_code = 13;
  string trace_id = 14;
  repeated AppliedRuleReadback applied_entries = 15;
  string readback_manifest_digest = 16;
  BoundedCaptureReadback bounded_capture = 17;
}

// BoundedCaptureReadback proves the exact bounded capture window and evidence
// identity without returning packet payload on the control RPC.
message BoundedCaptureReadback {
  string schema_version = 1;
  string capture_id = 2;
  string capture_digest = 3;
  string capture_session_id = 4;
  int64 started_at_unix_ms = 5;
  int64 finished_at_unix_ms = 6;
  uint32 observed_samples = 7;
  uint64 observed_bytes = 8;
  string content_digest = 9;
  string observed_flow_digest = 10;
  string capture_window_digest = 11;
  bool truncated = 12;
  bool gap = 13;
}

message AppliedRuleReadback {
  string entity_id = 1;
  string rule_id = 2;
  string canonical_entry_digest = 3;
  string match_priority_action_digest = 4;
  uint32 table_id = 5;
  uint32 direct_counter_id = 6;
  uint32 bank = 7;
}

message AcknowledgeEffectRequest {
  string schema_version = 1;
  string target_id = 2;
  string effect_intent_id = 3;
  string operation_id = 4;
  Fence fence = 5;
  string result_digest = 6;
  string canonical_effect_reference = 7;
  int64 committed_at_unix_ms = 8;
  string trace_id = 9;
}

message CanonicalP4Entry {
  string logical_rule_id = 1;
  uint32 table_id = 2;
  uint32 direct_counter_id = 3;
  uint32 bank = 4;
  bytes entity = 5;
  string canonical_entry_digest = 6;
  string entity_id = 7;
  string match_priority_action_digest = 8;
}

message CompiledEffectPlan {
  string schema_version = 1;
  string target_id = 2;
  string effect_intent_id = 3;
  EffectKind kind = 4;
  uint32 active_bank = 5;
  uint32 inactive_bank = 6;
  repeated CanonicalP4Entry entries = 7;
  bytes default_entity = 8;
  bytes selector_entity = 9;
  string plan_digest = 10;
}

enum JournalStage {
  JOURNAL_STAGE_UNSPECIFIED = 0;
  JOURNAL_STAGE_WRITE_STARTED = 1;
  JOURNAL_STAGE_WRITE_RETURNED = 2;
  JOURNAL_STAGE_READBACK_EXACT = 3;
  JOURNAL_STAGE_SELECTOR_STARTED = 4;
  JOURNAL_STAGE_SELECTOR_EXACT = 5;
  JOURNAL_STAGE_RESULT_REPORTED = 6;
  JOURNAL_STAGE_CHECKPOINTED = 7;
  JOURNAL_STAGE_HOLD = 8;
  JOURNAL_STAGE_UNKNOWN = 9;
}

message EffectJournalRecord {
  string schema_version = 1;
  JournalStage stage = 2;
  EffectIntent intent = 3;
  CompiledEffectPlan plan = 4;
  EffectResult result = 5;
  int64 recorded_at_unix_ms = 6;
  string reason_code = 7;
}

enum SourceWalStage {
  SOURCE_WAL_STAGE_UNSPECIFIED = 0;
  SOURCE_WAL_STAGE_BANK_FREEZE_STARTED = 1;
  SOURCE_WAL_STAGE_BANK_FROZEN = 2;
  SOURCE_WAL_STAGE_SNAPSHOT_DURABLE = 3;
  SOURCE_WAL_STAGE_CLEAR_COMPLETED = 4;

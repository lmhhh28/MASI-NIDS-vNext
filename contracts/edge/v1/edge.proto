  uint32 frozen_bank = 7;
  uint32 new_active_bank = 8;
  uint64 previous_epoch = 9;
  uint64 new_epoch = 10;
  uint64 operation_wal_sequence = 11;
  uint64 source_sequence = 12;
  uint64 counter_packets_before = 13;
  uint64 counter_bytes_before = 14;
  string reason_code = 15;
  string source_runtime_epoch = 16;

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
      - run: python -m pip install jsonschema==4.26.0
      - run: python3 scripts/ci/check_repository_hygiene.py
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

  p4-contracts:
    name: p4-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
      - run: python -m pip install --requirement testkit/p4_switch/requirements-e2e.txt
      - name: Contract, golden, and runner unit checks
        env:
          # p4runtime 1.4.1 still publishes legacy Python descriptors while the
          # qualified test closure pins protobuf 6.33.5.
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        run: |
          mapfile -t tests < <(
            find testkit/p4_switch/tests -maxdepth 1 -name 'test_*.py' \
              ! -name 'test_p4_program.py' -printf '%p\n' \
              | sed -e 's#/#.#g' -e 's#\.py$##' | sort
          )
          PYTHONPATH="$PWD" python -m unittest -v "${tests[@]}"

  edge-rust:
    name: edge-rust
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - working-directory: edge-rs
        run: cargo +1.97.1 fmt --all -- --check
      - working-directory: edge-rs
        run: python3 scripts/validate-public-contracts.py --repo ..
      - working-directory: edge-rs
        run: python3 scripts/validate-traceability.py --repo .. --manifest requirements-traceability.json
      - working-directory: edge-rs
        run: cargo +1.97.1 clippy --all-targets --locked -- -D warnings
      - working-directory: edge-rs
        env:
          MASI_EDGE_EVIDENCE_DIR: ${{ runner.temp }}/edge-evidence
        run: cargo +1.97.1 test --locked --lib --bins --test contract_golden --test property_invariants

  plugin-host-rust:
    name: plugin-host-rust
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Install exact wasm-tools contract validator
        run: |
          cargo +1.97.1 install wasm-tools --version 1.256.0 --locked --root "${RUNNER_TEMP}/wasm-tools"
          echo "${RUNNER_TEMP}/wasm-tools/bin" >>"${GITHUB_PATH}"
      - working-directory: plugin-host-rs
        run: cargo +1.97.1 fmt --all -- --check
      - working-directory: plugin-host-rs
        run: python3 scripts/validate-contracts.py
      - working-directory: plugin-host-rs
        run: python3 scripts/check-source-sentinels.py
      - working-directory: plugin-host-rs
        run: cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings
      - working-directory: plugin-host-rs
        run: cargo +1.97.1 test --locked --all-features --lib --bins --test contract_golden --test property --test export_statistics_fixture -- --test-threads=1
      - working-directory: plugin-host-rs
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo +1.97.1 doc --locked --all-features --no-deps

  control-go:
    name: control-go
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache-dependency-path: control-go/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
      - run: python -m pip install jsonschema==4.26.0 PyYAML==6.0.3
      - working-directory: control-go
        run: test -z "$(gofmt -l ./cmd ./internal ./tests)"
      - working-directory: control-go
        run: go vet ./...
      - working-directory: control-go
        run: go test -count=1 ./...
      - working-directory: control-go
        run: python scripts/validate-public-contracts.py --repo ..
      - working-directory: control-go
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  postgresql-state:
    name: postgresql-state
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache-dependency-path: db/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
      - run: python -m pip install jsonschema==4.26.0 ruff==0.15.17
      - working-directory: db
        run: test -z "$(gofmt -l ./cmd ./internal ./tests)"
      - working-directory: db
        run: go vet ./...
      - working-directory: db
        run: go test -count=1 ./...
      - working-directory: db
        run: python scripts/test_evidence_tools.py
      - working-directory: db
        run: ruff check scripts

  analysis-python:
    name: analysis-python
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
      - run: python -m pip install uv==0.12.3 ruff==0.15.17 pyright==1.1.409
      - working-directory: analysis-py
        run: uv sync --frozen
      - working-directory: analysis-py
        run: ruff format --check src tests scripts
      - working-directory: analysis-py
        run: ruff check src tests scripts
      - working-directory: analysis-py
        run: pyright --project pyproject.toml
      - working-directory: analysis-py
        run: .venv/bin/python -m unittest discover -s tests -t . -v
      - working-directory: analysis-py
        run: .venv/bin/python scripts/validate-contracts.py

  offline-ml-python:
    name: offline-ml-python
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
      - run: python -m pip install uv==0.12.3
      - working-directory: ml-py
        run: uv sync --frozen --extra dev
      - working-directory: ml-py
        run: .venv/bin/ruff format --check src tests scripts
      - working-directory: ml-py
        run: .venv/bin/ruff check src tests scripts
      - working-directory: ml-py
        run: .venv/bin/pyright
      - working-directory: ml-py
        run: .venv/bin/python -m unittest discover -s tests -v
      - working-directory: ml-py
        run: .venv/bin/python scripts/validate-static-contracts.py --repo .. --output "${RUNNER_TEMP}/offline-ml-static.json"

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - working-directory: web
        run: npm run verify

  inference-contracts:
    name: inference-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
      - run: python -m pip install jsonschema==4.26.0 onnxruntime==1.19.0
      - working-directory: infer-cpp
        run: python scripts/validate-public-contracts.py --repo ..
      - working-directory: infer-cpp
        run: python scripts/run-numeric-golden.py --repo .. --evidence-dir "${RUNNER_TEMP}/inference-numeric"

  quick-ci-summary:
    name: quick-ci-summary
    if: always()
    needs:
      - repository-hygiene
      - p4-contracts
      - edge-rust
      - plugin-host-rust
      - control-go
      - postgresql-state
      - analysis-python
      - offline-ml-python
      - web
      - inference-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
      - run: python -m pip install jsonschema==4.26.0
      - id: summary
        name: Build explicit rehearsal-only CI summary
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          SOURCE_REVISION: ${{ github.sha }}
          RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}-quick-ci
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from jsonschema import Draft202012Validator, FormatChecker

          jobs = json.loads(os.environ["JOB_RESULTS"])
          results = {name: value["result"] for name, value in sorted(jobs.items())}
          passed = all(result == "success" for result in results.values())
          document = {
              "schema_version": "quick-ci-rehearsal-summary/v1",
              "run_id": os.environ["RUN_ID"],
              "source_revision": os.environ["SOURCE_REVISION"],
              "jobs": results,
              "level": "REHEARSAL",
              "applicability": "APPLICABLE",
              "result": "PASS" if passed else "FAIL",
              "qualification": "NOT_QUALIFIED",
              "qualification_scope": "HOSTED_UNPRIVILEGED_FAST_FEEDBACK_ONLY; NO_MODULE_PAIRWISE_SYSTEM_OR_RELEASE_QUALIFICATION",
          }
          schema = json.loads(Path("contracts/evidence/quick-ci/v1/schema.json").read_text(encoding="utf-8"))
          errors = sorted(
              Draft202012Validator(schema, format_checker=FormatChecker()).iter_errors(document),
              key=lambda error: list(error.path),
          )
          if errors:
              raise SystemExit("; ".join(f"{list(error.path)}: {error.message}" for error in errors))
          output = Path(os.environ["RUNNER_TEMP"]) / "quick-ci-summary.json"
          output.write_text(json.dumps(document, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"result={document['result']}\n")
          PY
      - name: Upload quick CI machine summary
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quick-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quick-ci-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Adjudicate quick CI
        if: always()
        env:
          SUMMARY_RESULT: ${{ steps.summary.outputs.result }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          [[ "${SUMMARY_RESULT}" == "PASS" ]] || { echo "one or more quick CI jobs failed" >&2; exit 1; }
          [[ "${UPLOAD_OUTCOME}" == "success" ]] || { echo "quick CI summary upload failed" >&2; exit 1; }

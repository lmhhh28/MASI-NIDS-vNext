name: Legacy reference integrity

on:
  pull_request:
    paths:
      - "legacy-reference/**"
      - ".dockerignore"
      - "NOTICE"
      - "README.md"
      - "REQUIREMENTS.md"
      - "scripts/ci/test_legacy_reference_isolation.py"
      - ".github/workflows/legacy-reference-integrity.yml"
  push:
    branches: [main]
    paths:
      - "legacy-reference/**"
      - ".dockerignore"
      - "NOTICE"
      - "README.md"
      - "REQUIREMENTS.md"
      - "scripts/ci/test_legacy_reference_isolation.py"
      - ".github/workflows/legacy-reference-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-reference-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  legacy-reference-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
      - run: python3 scripts/ci/test_legacy_reference_isolation.py

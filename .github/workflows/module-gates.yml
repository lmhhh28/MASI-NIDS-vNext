name: Module gates

on:
  schedule:
    - cron: "17 18 * * 6"
  workflow_dispatch:
    inputs:
      module:
        description: Exact module gate to execute
        required: true
        default: all
        type: choice
        options:
          - all
          - p4
          - edge
          - inference
          - control
          - db
          - plugin-host
          - analysis
          - offline-ml
          - web

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  select:
    name: select-modules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        name: Build bounded module matrix
        env:
          SELECTED_MODULE: ${{ inputs.module }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "formal module gates may only execute from refs/heads/main" >&2
            exit 64
          fi
          python3 - <<'PY' >>"${GITHUB_OUTPUT}"
          import json
          import os

          selected = os.environ.get("SELECTED_MODULE") or "all"
          modules = [
              ("p4", ["self-hosted", "linux", "x64", "masi-isolated", "masi-ephemeral", "masi-p4"]),
              ("edge", ["self-hosted", "linux", "x64", "masi-isolated", "masi-ephemeral", "masi-edge"]),
              ("inference", ["self-hosted", "linux", "x64", "masi-isolated", "masi-ephemeral", "masi-central-cpu"]),
              ("control", ["self-hosted", "linux", "x64", "masi-isolated", "masi-ephemeral", "masi-control"]),
              ("db", ["self-hosted", "linux", "x64", "masi-isolated", "masi-ephemeral", "masi-postgres"]),
              ("plugin-host", ["self-hosted", "linux", "x64", "masi-isolated", "masi-ephemeral", "masi-plugin-host"]),
              ("analysis", ["self-hosted", "linux", "x64", "masi-isolated", "masi-ephemeral", "masi-analysis"]),
              ("offline-ml", ["self-hosted", "linux", "x64", "masi-isolated", "masi-ephemeral", "masi-offline-ml"]),
              ("web", ["self-hosted", "linux", "x64", "masi-isolated", "masi-ephemeral", "masi-web"]),
          ]
          include = [
              {"module": module, "runner": json.dumps(labels, separators=(",", ":"))}
              for module, labels in modules
              if selected in {"all", module}
          ]
          if not include:
              raise SystemExit(f"unknown module selection: {selected}")
          print("matrix=" + json.dumps({"include": include}, separators=(",", ":")))
          PY

  gate:
    name: ${{ matrix.module }}
    needs: select
    environment: module-gates
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 360
    concurrency:
      group: module-gate-${{ matrix.module }}
      cancel-in-progress: false
    env:
      MASI_CI_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.module }}
      MASI_BMV2_SOURCE_ARCHIVE: ${{ vars.MASI_BMV2_SOURCE_ARCHIVE }}
      MASI_PI_SOURCE_ARCHIVE: ${{ vars.MASI_PI_SOURCE_ARCHIVE }}
      MASI_TRIVY_CACHE: ${{ vars.MASI_TRIVY_CACHE }}
      MASI_COSIGN_KEY_DIR: ${{ vars.MASI_COSIGN_KEY_DIR }}
      MASI_P4_RUNTIME_IMAGE: ${{ vars.MASI_P4_RUNTIME_IMAGE }}
      MASI_P4_RUNNER_IMAGE: ${{ vars.MASI_P4_RUNNER_IMAGE }}
      MASI_WEB_MANUAL_A11Y_EVIDENCE: ${{ vars.MASI_WEB_MANUAL_A11Y_EVIDENCE }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Preflight formal inputs
        id: preflight
        env:
          MODULE: ${{ matrix.module }}
        run: |
          preflight_log="${RUNNER_TEMP}/module-preflight-${MODULE}.log"
          set +e
          (
            test -z "$(git status --porcelain=v1 --untracked-files=all)" || exit 78
            if [[ "${MODULE}" == "p4" ]]; then
              for variable in MASI_BMV2_SOURCE_ARCHIVE MASI_PI_SOURCE_ARCHIVE MASI_TRIVY_CACHE MASI_COSIGN_KEY_DIR MASI_P4_RUNTIME_IMAGE MASI_P4_RUNNER_IMAGE; do
                [[ -n "${!variable:-}" ]] || { echo "missing protected P4 input: ${variable}" >&2; exit 78; }
              done
              [[ -f "${MASI_BMV2_SOURCE_ARCHIVE}" && ! -L "${MASI_BMV2_SOURCE_ARCHIVE}" ]] || exit 78
              [[ -f "${MASI_PI_SOURCE_ARCHIVE}" && ! -L "${MASI_PI_SOURCE_ARCHIVE}" ]] || exit 78
              [[ -d "${MASI_TRIVY_CACHE}" && ! -L "${MASI_TRIVY_CACHE}" ]] || exit 78
              [[ -d "${MASI_COSIGN_KEY_DIR}" && ! -L "${MASI_COSIGN_KEY_DIR}" ]] || exit 78
              [[ "${MASI_P4_RUNTIME_IMAGE}" =~ @sha256:[0-9a-f]{64}$ ]] || exit 78
              [[ "${MASI_P4_RUNNER_IMAGE}" =~ @sha256:[0-9a-f]{64}$ ]] || exit 78
              [[ ! "${MASI_P4_RUNTIME_IMAGE}" =~ @sha256:0{64}$ ]] || exit 78
              [[ ! "${MASI_P4_RUNNER_IMAGE}" =~ @sha256:0{64}$ ]] || exit 78
            fi
          ) >"${preflight_log}" 2>&1
          preflight_exit_code=$?
          set -e
          echo "exit_code=${preflight_exit_code}" >>"${GITHUB_OUTPUT}"
          if [[ "${preflight_exit_code}" -ne 0 ]]; then
            cat "${preflight_log}" >&2
            python3 scripts/ci/write_preflight_failure.py \
              --repo . --module "${MODULE}" --run-id "${MASI_CI_RUN_ID}" \
              --exit-code "${preflight_exit_code}" --log "${preflight_log}"
          fi
      - id: formal_gate
        name: Run exact formal module gate
        run: |
          if [[ "${{ steps.preflight.outputs.exit_code }}" -ne 0 ]]; then
            echo "exit_code=${{ steps.preflight.outputs.exit_code }}" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          set +e
          scripts/ci/run_module_gate.sh "${{ matrix.module }}" "${MASI_CI_RUN_ID}"
          gate_exit_code=$?
          set -e
          echo "exit_code=${gate_exit_code}" >>"${GITHUB_OUTPUT}"
      - name: Verify canonical gate summary
        id: verify
        if: always()
        env:
          GATE_EXIT_CODE: ${{ steps.formal_gate.outputs.exit_code }}
        run: |
          verifier_args=(--require-clean)
          if [[ "${GATE_EXIT_CODE:-}" != "0" ]]; then
            verifier_args+=(--allow-incomplete)
          fi
          python3 scripts/ci/verify_module_gate_output.py \
            "${{ matrix.module }}" "${MASI_CI_RUN_ID}" "${verifier_args[@]}"
      - name: Upload immutable gate evidence
        id: evidence_upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: module-gate-${{ matrix.module }}-${{ env.MASI_CI_RUN_ID }}
          path: |
            evidence/p4-switch/${{ env.MASI_CI_RUN_ID }}/**
            */evidence/module-gates/runs/${{ env.MASI_CI_RUN_ID }}/**
          if-no-files-found: error
          retention-days: 30
      - name: Adjudicate gate, verifier, and evidence upload
        if: always()
        env:
          GATE_EXIT_CODE: ${{ steps.formal_gate.outputs.exit_code }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          UPLOAD_OUTCOME: ${{ steps.evidence_upload.outcome }}
        run: |
          [[ "${GATE_EXIT_CODE:-}" =~ ^[0-9]+$ ]] || { echo "formal gate did not report an exit code" >&2; exit 1; }
          if [[ "${GATE_EXIT_CODE}" -ne 0 ]]; then
            echo "formal gate failed or remained HOLD with exit ${GATE_EXIT_CODE}" >&2
            exit "${GATE_EXIT_CODE}"
          fi
          [[ "${VERIFY_OUTCOME}" == "success" ]] || { echo "canonical verifier did not succeed" >&2; exit 1; }
          [[ "${UPLOAD_OUTCOME}" == "success" ]] || { echo "immutable evidence upload did not succeed" >&2; exit 1; }

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: masi
      POSTGRES_PASSWORD: masi
      POSTGRES_DB: masi_control_test
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masi -d masi_control_test"]
      interval: 1s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
